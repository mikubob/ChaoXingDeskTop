name: Windows build and offline acceptance
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
          architecture: x64
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install locked dependencies in an isolated environment
        shell: pwsh
        working-directory: desktop
        run: |
          python -m venv .venv-ci
          .venv-ci/Scripts/python.exe -m pip install --no-deps -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          .venv-ci/Scripts/python.exe scripts/verify_dependencies.py
          if ($LASTEXITCODE -ne 0) { throw 'Dependency verification failed' }
          .venv-ci/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency conflicts' }
      - name: 运行桌面离线单元测试
        shell: pwsh
        working-directory: desktop
        run: .venv-ci/Scripts/python.exe -m unittest discover -s tests -v
      - name: Build native WinUI 3 frontend
        shell: pwsh
        working-directory: desktop
        run: ./scripts/build-winui.ps1 -Python .venv-ci/Scripts/python.exe -SkipGuiSmoke
      - name: Native WinUI 3 smoke from source
        shell: pwsh
        working-directory: desktop
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QSG_RHI_BACKEND = 'software'
          .venv-ci/Scripts/python.exe run.py --smoke-test build/ci-checks/source
          $sourceSmokeExit = $LASTEXITCODE
          if (Test-Path build/ci-checks/source/result.json) { Get-Content build/ci-checks/source/result.json -Raw -Encoding UTF8 }
          if ($sourceSmokeExit -ne 0) { throw 'Source worker integration failed' }
          .venv-ci/Scripts/python.exe scripts/check_smoke_report.py build/ci-checks/source/result.json
          if ($LASTEXITCODE -ne 0) { throw 'Source smoke did not report the WinUI 3 frontend' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-check-reports
          path: desktop/build/ci-checks
          if-no-files-found: ignore
      - name: Build onedir and verify frozen worker
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        working-directory: desktop
        run: ./scripts/build.ps1 -OutputDirectory dist/ci/ChaoxingDesktop -SkipGuiSmoke
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: windows-build-requires-interactive-acceptance
          path: desktop/dist/ci/ChaoxingDesktop
          if-no-files-found: error
